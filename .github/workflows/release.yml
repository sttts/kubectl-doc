name: release

on:
  push:
    tags:
      - "*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check generated docs are current
        run: make check-generated

      - name: Run tests
        run: make test

      - name: Run golangci-lint
        run: make lint

  build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive: tar.gz
          - goos: linux
            goarch: arm64
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            archive: tar.gz
          - goos: windows
            goarch: amd64
            archive: zip
          - goos: windows
            goarch: arm64
            archive: zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOARCH: ${{ matrix.goarch }}
          GOOS: ${{ matrix.goos }}
        run: |
          set -euo pipefail

          safe_version="${GITHUB_REF_NAME//\//-}"
          target="kubectl-doc-${safe_version}-${GOOS}-${GOARCH}"
          binary="kubectl-doc"
          if [ "$GOOS" = "windows" ]; then
            binary="kubectl-doc.exe"
          fi

          mkdir -p "dist/${target}"
          go build -trimpath -ldflags="-s -w" -o "dist/${target}/${binary}" ./cmd/kubectl-doc
          cp LICENSE "dist/${target}/LICENSE"

      - name: Package binary
        env:
          GOARCH: ${{ matrix.goarch }}
          GOOS: ${{ matrix.goos }}
        run: |
          set -euo pipefail

          safe_version="${GITHUB_REF_NAME//\//-}"
          target="kubectl-doc-${safe_version}-${GOOS}-${GOARCH}"
          archive="${target}.${{ matrix.archive }}"

          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd dist && zip -qr "$archive" "$target")
          else
            tar -C dist -czf "dist/$archive" "$target"
          fi

          (cd dist && sha256sum "$archive" > "$archive.sha256")

      - name: Upload binary artifact
        uses: actions/upload-artifact@v6
        with:
          name: kubectl-doc-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.${{ matrix.archive }}
            dist/*.${{ matrix.archive }}.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: kubectl-doc-*
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes
          fi

  update-krew-index:
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref_name, 'v')

    env:
      GH_TOKEN: ${{ secrets.KREW_INDEX_TOKEN }}
      KREW_INDEX_FORK: sttts/krew-index
      KREW_INDEX_UPSTREAM: kubernetes-sigs/krew-index
      TAG: ${{ github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: kubectl-doc-*
          merge-multiple: true

      - name: Render doc Krew manifest
        run: |
          set -euo pipefail

          mkdir -p rendered
          manifest="rendered/doc.yaml"
          cp doc.yaml "$manifest"

          linux_amd64="$(cut -d ' ' -f1 "dist/kubectl-doc-${TAG}-linux-amd64.tar.gz.sha256")"
          linux_arm64="$(cut -d ' ' -f1 "dist/kubectl-doc-${TAG}-linux-arm64.tar.gz.sha256")"
          darwin_amd64="$(cut -d ' ' -f1 "dist/kubectl-doc-${TAG}-darwin-amd64.tar.gz.sha256")"
          darwin_arm64="$(cut -d ' ' -f1 "dist/kubectl-doc-${TAG}-darwin-arm64.tar.gz.sha256")"
          windows_amd64="$(cut -d ' ' -f1 "dist/kubectl-doc-${TAG}-windows-amd64.zip.sha256")"
          windows_arm64="$(cut -d ' ' -f1 "dist/kubectl-doc-${TAG}-windows-arm64.zip.sha256")"

          sed -i \
            -e "s/v0.0.0/${TAG}/g" \
            -e "s/TODO_LINUX_AMD64_SHA256/${linux_amd64}/g" \
            -e "s/TODO_LINUX_ARM64_SHA256/${linux_arm64}/g" \
            -e "s/TODO_DARWIN_AMD64_SHA256/${darwin_amd64}/g" \
            -e "s/TODO_DARWIN_ARM64_SHA256/${darwin_arm64}/g" \
            -e "s/TODO_WINDOWS_AMD64_SHA256/${windows_amd64}/g" \
            -e "s/TODO_WINDOWS_ARM64_SHA256/${windows_arm64}/g" \
            "$manifest"
          sed -i '/^#/d' "$manifest"

      - name: Push Krew manifest branch
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN}" ]; then
            echo "KREW_INDEX_TOKEN secret is not set."
            exit 1
          fi
          git_auth_header="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git_auth=(
            -c credential.helper=
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${git_auth_header}"
          )
          git "${git_auth[@]}" clone --depth 1 "https://github.com/${KREW_INDEX_FORK}.git" krew-index

          branch="update-doc-${TAG}"
          cd krew-index
          if git "${git_auth[@]}" ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git "${git_auth[@]}" fetch origin "$branch"
            git checkout -B "$branch" "origin/$branch"
          else
            git checkout -B "$branch"
          fi

          mkdir -p plugins
          cp ../rendered/doc.yaml plugins/doc.yaml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plugins/doc.yaml
          if git diff --cached --quiet; then
            echo "Krew manifest for ${TAG} is already current."
            exit 0
          fi
          git commit -m "plugins/doc: update to ${TAG}"
          git "${git_auth[@]}" push -u origin "$branch"

      - name: Open Krew index pull request
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN}" ]; then
            echo "KREW_INDEX_TOKEN secret is not set."
            exit 1
          fi

          upstream_manifest="$(mktemp)"
          gh api "repos/${KREW_INDEX_UPSTREAM}/contents/plugins/doc.yaml" --jq .content | base64 -d > "$upstream_manifest"
          if cmp -s rendered/doc.yaml "$upstream_manifest"; then
            echo "Krew manifest for ${TAG} is already current in ${KREW_INDEX_UPSTREAM}."
            exit 0
          fi

          branch="update-doc-${TAG}"
          fork_owner="${KREW_INDEX_FORK%%/*}"
          head="${fork_owner}:${branch}"
          existing_pr="$(gh pr list \
            --repo "${KREW_INDEX_UPSTREAM}" \
            --search "head:${head}" \
            --state open \
            --json url \
            --jq '.[0].url // ""')"

          if [ -n "$existing_pr" ]; then
            echo "Krew manifest pull request already exists: ${existing_pr}"
            exit 0
          fi

          pr_url="$(gh api -X POST "repos/${KREW_INDEX_UPSTREAM}/pulls" \
            -f title="plugins/doc: update to ${TAG}" \
            -f head="$head" \
            -f base=master \
            -f body="Update kubectl-doc Krew manifest for ${TAG}." \
            --jq .html_url)"
          echo "Opened Krew manifest pull request: ${pr_url}"

  update-homebrew-tap:
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref_name, 'v')

    env:
      GH_TOKEN: ${{ secrets.KREW_INDEX_TOKEN }}
      HOMEBREW_TAP_REPO: sttts/homebrew-tap
      TAG: ${{ github.ref_name }}

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: kubectl-doc-*
          merge-multiple: true

      - name: Render Homebrew formula
        run: |
          set -euo pipefail

          mkdir -p rendered
          formula="rendered/kubectl-doc.rb"
          version="${TAG#v}"

          linux_amd64="$(cut -d ' ' -f1 "dist/kubectl-doc-${TAG}-linux-amd64.tar.gz.sha256")"
          linux_arm64="$(cut -d ' ' -f1 "dist/kubectl-doc-${TAG}-linux-arm64.tar.gz.sha256")"
          darwin_amd64="$(cut -d ' ' -f1 "dist/kubectl-doc-${TAG}-darwin-amd64.tar.gz.sha256")"
          darwin_arm64="$(cut -d ' ' -f1 "dist/kubectl-doc-${TAG}-darwin-arm64.tar.gz.sha256")"

          cat > "$formula" <<EOF
          class KubectlDoc < Formula
            desc "Render Kubernetes API documentation"
            homepage "https://github.com/${GITHUB_REPOSITORY}"
            version "${version}"
            license "Apache-2.0"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/kubectl-doc-${TAG}-darwin-arm64.tar.gz"
                sha256 "${darwin_arm64}"
              else
                url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/kubectl-doc-${TAG}-darwin-amd64.tar.gz"
                sha256 "${darwin_amd64}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/kubectl-doc-${TAG}-linux-arm64.tar.gz"
                sha256 "${linux_arm64}"
              else
                url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/kubectl-doc-${TAG}-linux-amd64.tar.gz"
                sha256 "${linux_amd64}"
              end
            end

            def install
              bin.install Dir["kubectl-doc", "kubectl-doc-*/kubectl-doc"].first => "kubectl-doc"

              license_file = Dir["LICENSE", "kubectl-doc-*/LICENSE"].first
              doc.install license_file if license_file
            end

            test do
              assert_match "kubectl-doc", shell_output("#{bin}/kubectl-doc --help")
            end
          end
          EOF

      - name: Push Homebrew formula
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN}" ]; then
            echo "KREW_INDEX_TOKEN secret is not set."
            exit 1
          fi
          git_auth_header="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git_auth=(
            -c credential.helper=
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${git_auth_header}"
          )
          git "${git_auth[@]}" clone --depth 1 "https://github.com/${HOMEBREW_TAP_REPO}.git" homebrew-tap

          cd homebrew-tap
          mkdir -p Formula
          cp ../rendered/kubectl-doc.rb Formula/kubectl-doc.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/kubectl-doc.rb
          if git diff --cached --quiet; then
            echo "Homebrew formula for ${TAG} is already current."
            exit 0
          fi
          git commit -m "formula: update kubectl-doc ${TAG#v}"
          git "${git_auth[@]}" push origin HEAD:main
