apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: doc
spec:
  version: {{ .TagName }}
  homepage: https://github.com/sttts/kubectl-doc
  shortDescription: Render Kubernetes API documentation
  description: |
    Render Kubernetes OpenAPI v3 schemas as YAML-shaped documentation for
    terminal, Markdown, HTML, and interactive documentation surfaces.

    kubectl doc can read schemas from a live cluster or from local CRD
    manifests. It supports YAML, Markdown, Kro SimpleSchema, HTML, browser,
    and terminal UI output formats.
  platforms:
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      {{ addURIAndSha "https://github.com/sttts/kubectl-doc/releases/download/{{ .TagName }}/kubectl-doc-{{ .TagName }}-linux-amd64.tar.gz" .TagName | indent 6 }}
      files:
        - from: kubectl-doc-{{ .TagName }}-linux-amd64/kubectl-doc
          to: .
        - from: kubectl-doc-{{ .TagName }}-linux-amd64/LICENSE
          to: .
      bin: kubectl-doc

    - selector:
        matchLabels:
          os: linux
          arch: arm64
      {{ addURIAndSha "https://github.com/sttts/kubectl-doc/releases/download/{{ .TagName }}/kubectl-doc-{{ .TagName }}-linux-arm64.tar.gz" .TagName | indent 6 }}
      files:
        - from: kubectl-doc-{{ .TagName }}-linux-arm64/kubectl-doc
          to: .
        - from: kubectl-doc-{{ .TagName }}-linux-arm64/LICENSE
          to: .
      bin: kubectl-doc

    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      {{ addURIAndSha "https://github.com/sttts/kubectl-doc/releases/download/{{ .TagName }}/kubectl-doc-{{ .TagName }}-darwin-amd64.tar.gz" .TagName | indent 6 }}
      files:
        - from: kubectl-doc-{{ .TagName }}-darwin-amd64/kubectl-doc
          to: .
        - from: kubectl-doc-{{ .TagName }}-darwin-amd64/LICENSE
          to: .
      bin: kubectl-doc

    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      {{ addURIAndSha "https://github.com/sttts/kubectl-doc/releases/download/{{ .TagName }}/kubectl-doc-{{ .TagName }}-darwin-arm64.tar.gz" .TagName | indent 6 }}
      files:
        - from: kubectl-doc-{{ .TagName }}-darwin-arm64/kubectl-doc
          to: .
        - from: kubectl-doc-{{ .TagName }}-darwin-arm64/LICENSE
          to: .
      bin: kubectl-doc

    - selector:
        matchLabels:
          os: windows
          arch: amd64
      {{ addURIAndSha "https://github.com/sttts/kubectl-doc/releases/download/{{ .TagName }}/kubectl-doc-{{ .TagName }}-windows-amd64.zip" .TagName | indent 6 }}
      files:
        - from: kubectl-doc-{{ .TagName }}-windows-amd64/kubectl-doc.exe
          to: .
        - from: kubectl-doc-{{ .TagName }}-windows-amd64/LICENSE
          to: .
      bin: kubectl-doc.exe

    - selector:
        matchLabels:
          os: windows
          arch: arm64
      {{ addURIAndSha "https://github.com/sttts/kubectl-doc/releases/download/{{ .TagName }}/kubectl-doc-{{ .TagName }}-windows-arm64.zip" .TagName | indent 6 }}
      files:
        - from: kubectl-doc-{{ .TagName }}-windows-arm64/kubectl-doc.exe
          to: .
        - from: kubectl-doc-{{ .TagName }}-windows-arm64/LICENSE
          to: .
      bin: kubectl-doc.exe
